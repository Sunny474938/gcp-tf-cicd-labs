name: Terraform Plan

on:
  pull_request:
    branches: [main]

env:
  TF_IN_AUTOMATION: "1"
  TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}

jobs:
  inspect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the blueprint
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: latest

      - name: Initialize TFLint plugins
        run: tflint --init
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run TFLint
        run: tflint --recursive

      - name: Run Trivy security scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'config'
          scan-ref: '.'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

  plan:
    needs: inspect
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, prod]
    steps:
      - name: Check out the blueprint
        uses: actions/checkout@v7

      - name: Flash the badge
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: true

      - name: Terraform init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.GCP_PROJECT_ID }}-tf-state" \
            -backend-config="prefix=labs/blueprint-crew${{ matrix.environment == 'dev' && '/dev' || '' }}"

      - name: Terraform validate
        run: terraform validate -no-color

      - name: Terraform plan
        id: plan
        run: terraform plan -no-color -input=false -var-file="environments/${{ matrix.environment }}.tfvars"
        continue-on-error: true

      - name: Post plan to PR
        uses: actions/github-script@v7
        env:
          PLAN: ${{ steps.plan.outputs.stdout }}
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
          ENVIRONMENT: ${{ matrix.environment }}
        with:
          script: |
            let output = '#### Terraform Plan Review — ' + process.env.ENVIRONMENT + '\n\n';
            output += 'Plan status: `' + process.env.PLAN_OUTCOME + '`\n\n';
            output += '';

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

      - name: Fail if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1