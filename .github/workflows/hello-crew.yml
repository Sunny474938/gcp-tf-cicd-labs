name: Hello Crew

on:
  push:
    branches: [main]

  workflow_dispatch:
    inputs:
      greeting:
        description: "Message for the crew"
        required: false
        default: "Reporting for duty."

jobs:
  say-hello:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the blueprint
        uses: actions/checkout@v4

      - name: Report for duty
        run: echo "${{ inputs.greeting || 'The crew has arrived on site.' }}"

      - name: Show today's date
        run: date