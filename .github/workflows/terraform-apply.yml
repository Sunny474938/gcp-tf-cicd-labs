name: Terraform Apply with different SA

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  TF_IN_AUTOMATION: "1"
  TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the blueprint
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Refuse to run from anything but main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "This workflow only applies from main. Selected ref: ${{ github.ref }}"
          exit 1

      - name: Flash the build crew's badge
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_APPLY_SERVICE_ACCOUNT }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform init
        run: terraform init -backend-config="bucket=${{ vars.GCP_PROJECT_ID }}-tf-state" -input=false

      - name: Terraform apply
        run: terraform apply -auto-approve -input=false